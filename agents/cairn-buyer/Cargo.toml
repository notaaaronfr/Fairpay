[package]
name = "fairpay-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A governed AI buyer: hires and pays freelancers through Fairpay's MCP server, on proof, under a budget and human approval."
publish = false

[dependencies]
cairn = { package = "cairn-ai", git = "https://github.com/whatstask/Cairn", features = ["mcp"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
