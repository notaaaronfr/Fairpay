# One-click deploy on Render: New → Blueprint → this repo.
services:
  - type: web
    name: fairpay
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FAIRPAY_BASE_URL
        sync: false
