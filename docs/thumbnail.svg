<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <radialGradient id="glow" cx="78%" cy="85%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1f2733"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#1b1300" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1500" height="1000" fill="#07080b"/>
  <rect x="40" y="40" width="1420" height="920" rx="56" fill="#ffc439"/>
  <rect x="40" y="40" width="1420" height="920" rx="56" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(110 112)">
    <g transform="scale(1.6)">
      <rect x="4" y="12" width="26" height="24" rx="12" fill="none" stroke="#003087" stroke-width="6.5"/>
      <rect x="18" y="12" width="26" height="24" rx="12" fill="none" stroke="#0070e0" stroke-width="6.5"/>
      <path d="M22.4 13.1A12 12 0 0 1 30 24" fill="none" stroke="#003087" stroke-width="6.5"/>
    </g>
    <text x="92" y="52" font-family="Helvetica Neue, Helvetica, Arial" font-size="46" font-weight="600" letter-spacing="-1.8" fill="#14110a">fairpay</text>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="24" fill="#14110a">
    <rect x="1078" y="118" width="300" height="52" rx="26" fill="none" stroke="#14110a" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="1110" cy="144" r="7" fill="#14110a"/>
    <text x="1130" y="152">Escrow on PayPal</text>
  </g>

  <!-- headline -->
  <text x="104" y="420" font-family="Helvetica Neue, Helvetica, Arial" font-size="178" font-weight="200" letter-spacing="-9" fill="#14110a">Pay on proof.</text>
  <text x="112" y="492" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" font-weight="300" letter-spacing="-.6" fill="#14110a" fill-opacity=".72">Money held in PayPal. Work checked by AI. Paid on approval.</text>

  <!-- tracker -->
  <g font-family="Helvetica Neue, Helvetica, Arial" fill="#14110a">
    <line x1="120" y1="640" x2="860" y2="640" stroke="#14110a" stroke-opacity=".2" stroke-width="4"/>
    <line x1="120" y1="640" x2="620" y2="640" stroke="#14110a" stroke-width="4"/>
    <circle cx="120" cy="640" r="13" fill="#14110a"/>
    <circle cx="370" cy="640" r="13" fill="#14110a"/>
    <circle cx="620" cy="640" r="20" fill="#14110a"/>
    <circle cx="620" cy="640" r="34" fill="#14110a" fill-opacity=".1"/>
    <circle cx="860" cy="640" r="12" fill="#ffc439" stroke="#14110a" stroke-opacity=".45" stroke-width="4"/>
    <g font-size="30" font-weight="400">
      <text x="104" y="702">Funded</text>
      <text x="340" y="702">Proven</text>
      <text x="596" y="702">Paid</text>
      <text x="816" y="702" fill-opacity=".55">Settled</text>
    </g>
    <g font-size="22" fill-opacity=".55">
      <text x="104" y="736">$300 held</text>
      <text x="340" y="736">✓ 3/3 criteria</text>
      <text x="596" y="736">+$120.00</text>
    </g>
  </g>

  <!-- footer chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="24" fill="#14110a">
    <rect x="104" y="836" width="208" height="56" rx="28" fill="#14110a"/>
    <text x="134" y="872" fill="#ffc439">✦ AI referee</text>
    <rect x="326" y="836" width="216" height="56" rx="28" fill="none" stroke="#14110a" stroke-opacity=".3" stroke-width="2"/>
    <text x="356" y="872">Cairn agents</text>
    <rect x="556" y="836" width="168" height="56" rx="28" fill="none" stroke="#14110a" stroke-opacity=".3" stroke-width="2"/>
    <text x="588" y="872">MCP</text>
  </g>

  <!-- escrow card -->
  <g transform="translate(990 520) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="270" rx="34" fill="url(#card)"/>
    <rect x="0" y="0" width="420" height="270" rx="34" fill="url(#sheen)"/>
    <text x="34" y="54" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" letter-spacing="3" fill="#fff" fill-opacity=".7">ESCROW · USD</text>
    <rect x="34" y="82" width="54" height="40" rx="9" fill="#cfd4dc"/>
    <text x="34" y="214" font-family="Helvetica Neue, Helvetica, Arial" font-size="44" font-weight="200" letter-spacing="-1.5" fill="#fff">$300.00</text>
    <text x="34" y="246" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" fill="#fff" fill-opacity=".65">Held for Lina Haddad</text>
    <g transform="translate(262 120) scale(3.2)">
      <rect x="4" y="12" width="26" height="24" rx="12" fill="none" stroke="#ffc439" stroke-width="6.5"/>
      <rect x="18" y="12" width="26" height="24" rx="12" fill="none" stroke="#2b8cff" stroke-width="6.5"/>
      <path d="M22.4 13.1A12 12 0 0 1 30 24" fill="none" stroke="#ffc439" stroke-width="6.5"/>
    </g>
  </g>
</svg>
